# ============================================================
# HOMEPAGE360 — Tableau de bord
# Corrections appliquées :
#  1. Section "ports" supprimée — accès uniquement via Traefik
#  2. Système de login interne retiré — sécurité gérée par TinyAuth
# ============================================================

services:
  homepage360:
    build:
      context: .
      dockerfile: Dockerfile
    image: homepage360:latest
    container_name: homepage360
    restart: always
    # Pas de section "ports" — Traefik communique directement
    # avec le conteneur via le réseau Docker (port 3000 interne)
    environment:
      - MONITOR_API_KEY=${MONITOR_API_KEY}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.homepage360.rule=Host(`home.bandtrack.fr`)"
      - "traefik.http.routers.homepage360.entrypoints=websecure"
      - "traefik.http.routers.homepage360.tls.certresolver=letsencrypt"
      - "traefik.http.services.homepage360.loadbalancer.server.port=3000"

networks:
  web:
    external: true
